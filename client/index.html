<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Видеочат</title>

    <!--
      Шрифты подключены отдельным запросом к Google Fonts и намеренно не влияют
      на отрисовку: display=swap рисует текст системным шрифтом сразу, а Plex и
      Unbounded подменяют его, когда доедут. Если сети нет вовсе — запрос просто
      не выполнится, и интерфейс останется на системном стеке из --font-sans:
      вёрстка от этого не меняется, потому что размеры и интерлиньяж заданы в
      пикселях, а не в ширине глифов.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
